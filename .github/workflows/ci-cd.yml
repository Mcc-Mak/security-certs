name: "CI/CD Pipeline"

on:
  push:
    branches:
      - dev-001
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. RELEASE — Version bump & CHANGELOG (dev-001 push only).
  #    Parses conventional commits since the last chore(release) commit,
  #    computes the next semver, prepends a CHANGELOG entry, and pushes a
  #    release commit to dev-001. Uses GITHUB_TOKEN; its push only changes
  #    CHANGELOG.md (ignored by paths-ignore) so it does NOT re-trigger.
  #    Loop-guarded: skips if HEAD is already a release commit.
  # =========================================================================
  release:
    name: Git Control (Version & Changelog)
    if: github.ref == 'refs/heads/dev-001' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Loop guard — skip own release commits
        id: guard
        run: |
          set -euo pipefail
          head_subject="$(git log -1 --format=%s)"
          if [[ "$head_subject" =~ ^chore\(release\):[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "skip=true (HEAD is release commit: $head_subject)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, update CHANGELOG, commit, push
        if: steps.guard.outputs.skip == 'false'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # 1. Current version = topmost "## X.Y.Z" in CHANGELOG.md (else 0.0.0)
          current="0.0.0"
          if [[ -f CHANGELOG.md ]]; then
            top="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)"
            if [[ "$top" =~ ^##\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              current="${BASH_REMATCH[1]}"
            fi
          fi
          echo "Current version: $current"

          # 2. Boundary = last "chore(release):" commit; else full history
          boundary="$(git log --grep="^chore(release):" -1 --format=%H || true)"
          if [[ -n "$boundary" ]]; then
            subjects="$(git log "${boundary}..HEAD" --format=%s)"
            bodies="$(git log "${boundary}..HEAD" --format=%B)"
          else
            subjects="$(git log --format=%s)"
            bodies="$(git log --format=%B)"
          fi

          # 3. Parse conventional commits → grouped entries + bump level
          feats=(); fixes=(); chores=(); others=(); breaking=0
          cc_re='^([a-z]+)(\([^)]*\))?(\!)?:\ (.+)'
          while IFS= read -r subj; do
            [[ -z "$subj" ]] && continue
            if [[ "$subj" =~ $cc_re ]]; then
              type="${BASH_REMATCH[1]}"; mark="${BASH_REMATCH[3]}"; rest="${BASH_REMATCH[4]}"
              if [[ -n "$mark" ]]; then breaking=1; fi
              case "$type" in
                feat)  feats+=("- $rest");;
                fix)   fixes+=("- $rest");;
                chore) chores+=("- $rest");;
                *)     others+=("- $type: $rest");;
              esac
            else
              others+=("- $subj")
            fi
          done <<< "$subjects"

          if grep -qi "^BREAKING CHANGE:" <<< "$bodies"; then breaking=1; fi

          if   [[ $breaking -eq 1 ]]; then bump="major"
          elif [[ ${#feats[@]} -gt 0 ]]; then bump="minor"
          else bump="patch"
          fi
          echo "Bump: $bump"

          # 4. Compute next version
          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0;;
            minor) minor=$((minor+1)); patch=0;;
            patch) patch=$((patch+1));;
          esac
          next="$major.$minor.$patch"
          echo "Next version: $next"

          # 5. Entry block (reused for CHANGELOG section + commit body)
          entry="$(mktemp)"
          {
            if [[ $breaking -eq 1 ]]; then
              printf '### Breaking\n- Breaking change introduced in this release\n\n'
            fi
            if [[ ${#feats[@]} -gt 0 ]]; then
              printf '### Added\n'; printf '%s\n' "${feats[@]}"; printf '\n'
            fi
            if [[ ${#fixes[@]} -gt 0 ]]; then
              printf '### Fixed\n'; printf '%s\n' "${fixes[@]}"; printf '\n'
            fi
            if [[ ${#chores[@]} -gt 0 ]] || [[ ${#others[@]} -gt 0 ]]; then
              printf '### Other\n'
              if [[ ${#chores[@]} -gt 0 ]]; then printf '%s\n' "${chores[@]}"; fi
              if [[ ${#others[@]} -gt 0 ]]; then printf '%s\n' "${others[@]}"; fi
              printf '\n'
            fi
          } > "$entry"

          # 6. Prepend new section to CHANGELOG.md (newest first)
          today="$(date -u +%Y-%m-%d)"
          {
            printf '# Changelog\n\n'
            printf 'All notable changes to this project are documented here. Versions follow semver.\n\n'
            printf '## %s (%s)\n\n' "$next" "$today"
            cat "$entry"
            if [[ -f CHANGELOG.md ]]; then
              awk 'BEGIN{h=1} h&&/^## [0-9]/{h=0} h{next} {print}' CHANGELOG.md
            fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          # 7. Conventional release commit + push to dev-001
          git add CHANGELOG.md
          git commit -m "chore(release): $next" -m "$(cat "$entry")"
          git push origin dev-001
          echo "Released $next"

  # =========================================================================
  # 2. FAST CHECKS — dev-001 gate (after release).
  #    Validates study-notes filename conventions, directory naming, mermaid
  #    fence balance, and encoding. Runs only on a dev-001 push (after the
  #    release job completes).
  # =========================================================================
  fast_checks:
    name: Fast Checks
    needs: release
    if: |
      !cancelled() &&
      needs.release.result != 'failure' &&
      github.ref == 'refs/heads/dev-001' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate note conventions
        run: ./scripts/validate-notes.sh

  # =========================================================================
  # 3. SECURITY CHECKS — gate before promotion (dev-001 push).
  #    SonarQube Cloud (SCA + Quality Gate). Runs after fast_checks passes
  #    on a dev-001 push. Sonar fails closed (blocks promotion) when
  #    SONAR_TOKEN is configured; skipped (with a notice) when absent.
  #    The main-branch SonarCloud baseline is established separately by
  #    the sonar_baseline job after promotion.
  #
  #    CodeQL is intentionally omitted — this is a prose repository with
  #    no analyzable source code.
  # =========================================================================
  security_checks:
    name: Security & Quality Gate
    needs: fast_checks
    if: |
      !cancelled() &&
      needs.fast_checks.result == 'success' &&
      github.ref == 'refs/heads/dev-001' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Pulls full git history for accurate Sonar attribution

      # 0. Detect whether SonarQube Cloud is configured. Sonar is optional:
      # when SONAR_TOKEN is absent, the job emits a notice and passes (no
      # SAST gate for a prose repo). When the token IS present, Sonar runs
      # and its Quality Gate fails closed.
      - name: Check Sonar configuration
        id: check_sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::notice::SONAR_TOKEN not set — skipping SonarQube Cloud quality gate. To enable, create a token and add it as the SONAR_TOKEN repository secret."
            echo "has_sonar=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_sonar=true" >> "$GITHUB_OUTPUT"
          fi

      # 1. SonarQube Cloud Scan (SCA + Quality + Code Smells) — only when configured.
      - name: SonarQube Cloud Scan
        if: steps.check_sonar.outputs.has_sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # 2. Halt pipeline execution if SonarQube Cloud Quality Gate fails.
      #    Custom script because sonarsource/sonarqube-quality-gate-action@v1
      #    gets 403 on SonarCloud's CE task API — it doesn't pass the
      #    organization parameter required by SonarCloud for project-scoped
      #    tokens.
      - name: SonarQube Quality Gate Check
        if: steps.check_sonar.outputs.has_sonar == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        timeout-minutes: 5
        run: |
          set -euo pipefail
          metadata=".scannerwork/report-task.txt"
          ceTaskId=$(sed -n 's/^ceTaskId=\(.*\)/\1/p' "$metadata")
          dashboardUrl=$(sed -n 's/^dashboardUrl=\(.*\)/\1/p' "$metadata")
          organization=$(sed -n 's/^organization=\(.*\)/\1/p' "$metadata")

          # This job is a pre-promotion gate — fail closed on ERROR status.
          # NONE is treated as non-fatal (first-run / free-plan limitation;
          # see the NONE branch below).  The main-branch baseline
          # (informational) is handled by the separate sonar_baseline job
          # after promotion.
          fail_closed=1

          echo "Polling CE task: $ceTaskId (organization: $organization)"

          # Poll CE task status (with organization parameter for SonarCloud)
          status="PENDING"
          endTime=$(( SECONDS + 280 ))
          while [[ "$status" == "PENDING" || "$status" == "IN_PROGRESS" ]] && [ $SECONDS -lt $endTime ]; do
            printf '.'
            sleep 5
            response=$(curl -sf --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/ce/task?id=${ceTaskId}&organization=${organization}" || echo '{"task":{"status":"PENDING"}}')
            status=$(echo "$response" | jq -r '.task.status')
          done
          echo ""

          if [[ "$status" == "PENDING" || "$status" == "IN_PROGRESS" ]]; then
            echo "::error::Polling timeout reached waiting for Sonar scan to complete"
            exit 1
          fi
          if [[ "$status" == "CANCELED" ]]; then
            echo "::error::Sonar background task was CANCELED"
            exit 1
          fi
          if [[ "$status" == "FAILED" ]]; then
            errorMsg=$(echo "$response" | jq -r '.task.errorMessage // "No error message"')
            echo "::error::Sonar background task FAILED: $errorMsg"
            exit 1
          fi

          analysisId=$(echo "$response" | jq -r '.task.analysisId')
          echo "Analysis ID: $analysisId"

          # Check quality gate status.  SonarCloud's free plan restricts
          # non-main branch data access via API, so we try multiple approaches:
          #   1. analysisId + organization  (may 403 on free plan)
          #   2. projectKey + branch        (may 403 on free plan)
          #   3. projectKey (main branch)   (works, but may be NONE if no
          #                                  main-branch analysis exists yet)
          projectKey=$(sed -n 's/^projectKey=\(.*\)/\1/p' "$metadata")
          branch="${GITHUB_REF_NAME:-}"
          qgStatus=""

          # Attempt 1: analysisId + organization
          qgResponse=$(curl -s -w "\n%{http_code}" --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analysisId}&organization=${organization}" 2>/dev/null || true)
          httpCode=$(echo "$qgResponse" | tail -1)
          qgBody=$(echo "$qgResponse" | head -n -1)
          echo "Quality gate API (analysisId): HTTP $httpCode"

          if [[ "$httpCode" == "200" ]]; then
            qgStatus=$(echo "$qgBody" | jq -r '.projectStatus.status')
          elif [[ -n "$branch" ]]; then
            # Attempt 2: projectKey + branch + organization
            qgResponse=$(curl -s -w "\n%{http_code}" --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${projectKey}&organization=${organization}&branch=${branch}" 2>/dev/null || true)
            httpCode=$(echo "$qgResponse" | tail -1)
            qgBody=$(echo "$qgResponse" | head -n -1)
            echo "Quality gate API (projectKey+branch): HTTP $httpCode"
            if [[ "$httpCode" == "200" ]]; then
              qgStatus=$(echo "$qgBody" | jq -r '.projectStatus.status')
            fi
          fi

          # Attempt 3: projectKey only (main branch, no branch parameter)
          if [[ -z "$qgStatus" || "$qgStatus" == "null" ]]; then
            qgResponse=$(curl -s -w "\n%{http_code}" --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${projectKey}&organization=${organization}" 2>/dev/null || true)
            httpCode=$(echo "$qgResponse" | tail -1)
            qgBody=$(echo "$qgResponse" | head -n -1)
            echo "Quality gate API (projectKey, main): HTTP $httpCode"
            if [[ "$httpCode" == "200" ]]; then
              qgStatus=$(echo "$qgBody" | jq -r '.projectStatus.status')
            fi
          fi

          echo "Quality Gate status: $qgStatus"
          echo "Dashboard: $dashboardUrl"

          if [[ -z "$qgStatus" || "$qgStatus" == "null" ]]; then
            echo "::error::Could not retrieve Quality Gate status (HTTP $httpCode). Check SONAR_TOKEN has Browse permission on the project."
            exit 1
          fi

          if [[ "$qgStatus" == "OK" ]]; then
            echo "::notice::Quality Gate PASSED"
          elif [[ "$qgStatus" == "WARN" ]]; then
            echo "::warning::Quality Gate has WARNINGS"
          elif [[ "$qgStatus" == "ERROR" ]]; then
            echo "::error::Quality Gate FAILED (status: ERROR). Review findings on the SonarCloud dashboard: ${dashboardUrl}"
            if [[ "$fail_closed" == "1" ]]; then exit 1; fi
          elif [[ "$qgStatus" == "NONE" ]]; then
            # NONE can mean: (a) no QG assigned, (b) no main-branch analysis
            # yet, or (c) SonarCloud free plan — non-main branch QG status is
            # not accessible via API.  Since the CE task succeeded (scan
            # accepted) and the Sonar way QG is assigned, this is a first-run
            # / plan-limitation scenario.  The sonar_baseline job establishes
            # the main-branch baseline after promotion; subsequent runs will
            # have proper QG evaluation once main has an analysis.
            echo "::notice::Quality Gate status is NONE (CE task succeeded). SonarCloud free plan cannot query non-main branch QG via API; main branch has no baseline yet. The sonar_baseline job will establish it after promotion."
          else
            echo "::error::Unexpected Quality Gate status: $qgStatus"
            if [[ "$fail_closed" == "1" ]]; then exit 1; fi
          fi

  # =========================================================================
  # 4. PROMOTE — Direct push dev-001 → dev → main.
  #    Runs after security_checks passes on a dev-001 push. Pushes the
  #    dev-001 HEAD commit directly to dev and main using GITHUB_TOKEN.
  #    No PRs are created — the gate checks (fast_checks, security_checks)
  #    have already run in this same workflow, so there is no need for
  #    separate PR-triggered gate runs.
  #
  #    GITHUB_TOKEN pushes do not trigger new workflow runs (GitHub security
  #    feature), which is exactly what we want: pages, wiki, and
  #    sonar_baseline run as downstream jobs in THIS run, not new runs.
  #
  #    --force-with-lease handles the case where dev/main contain stale
  #    merge commits; dev-001 is the canonical source.
  # =========================================================================
  promote:
    name: Auto-Promote (dev-001 → dev → main)
    needs: security_checks
    if: |
      !cancelled() &&
      needs.security_checks.result == 'success' &&
      github.ref == 'refs/heads/dev-001' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Promote dev-001 → dev → main (direct push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Promoting commit $sha"

          git fetch origin dev main

          # dev-001 → dev
          dev_sha="$(git rev-parse origin/dev)"
          if [ "$dev_sha" = "$sha" ]; then
            echo "dev already at $sha — skipping"
          else
            echo "Pushing $sha → dev (was $dev_sha)"
            git push --force-with-lease=dev:"$dev_sha" origin "$sha:refs/heads/dev"
          fi

          # dev → main
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" = "$sha" ]; then
            echo "main already at $sha — skipping"
          else
            echo "Pushing $sha → main (was $main_sha)"
            git push --force-with-lease=main:"$main_sha" origin "$sha:refs/heads/main"
          fi

  # =========================================================================
  # 5. PAGES — Deploy Docsify site to GitHub Pages.
  #    Assembles _site/ from pages/ (Docsify shell) + codebase/ (study notes)
  #    and deploys it. No build step — Docsify renders client-side. Runs
  #    after the promote job pushes dev-001 to main. Checks out main (the
  #    promoted commit) so the deployed artifact matches what was promoted.
  # =========================================================================
  pages:
    name: Deploy Docsify Site to GitHub Pages
    needs: [promote]
    if: |
      !cancelled() &&
      needs.promote.result == 'success' &&
      github.ref == 'refs/heads/dev-001' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout Repository (main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Assemble Docsify site
        run: ./scripts/build-pages.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

  # =========================================================================
  # 6. WIKI — Sync engineering docs to GitHub Wiki.
  #    Publishes docbase/ engineering docs to the wiki: Home.md (root
  #    README.md), TOCTREE.md (flattened links), and docbase/docs/*.md.
  #    Study notes (codebase/) are NOT published here — they live on the
  #    Pages site. Runs in parallel with the pages and sonar_baseline jobs
  #    after promote pushes to main. Checks out main (the promoted commit).
  #    Uses PROMOTE_TOKEN (a PAT with repo scope) for the wiki repo push.
  #
  #    The wiki is a separate git repo at {repo}.wiki.git. GitHub does not
  #    create this repo until the first page is saved through the web UI
  #    (there is no API to bootstrap it). Until then the job prints a
  #    notice and exits 0 so it does not block the rest of the pipeline;
  #    once initialized, subsequent runs sync normally.
  # =========================================================================
  wiki:
    name: Sync Docs to GitHub Wiki
    needs: [promote]
    if: |
      !cancelled() &&
      needs.promote.result == 'success' &&
      github.ref == 'refs/heads/dev-001' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: wiki
      cancel-in-progress: false

    steps:
      - name: Checkout Repository (main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate wiki content and sync
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROMOTE_TOKEN secret is not set. It is reused for wiki pushes (repo scope covers the .wiki.git repo). Add it as the PROMOTE_TOKEN repository secret."
            exit 1
          fi

          repo_full="${{ github.repository }}"
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${repo_full}.wiki.git"
          wiki_dir="$(mktemp -d)"

          # Clone the wiki repo. GitHub does not create the .wiki.git
          # repository until the first page is saved through the web UI.
          # Until then, print a notice and exit 0 so the pipeline is not
          # blocked; once initialized, subsequent runs sync normally.
          if ! git clone --depth 1 "$wiki_url" "$wiki_dir" 2>/dev/null; then
            echo "::warning::Wiki repo not found for ${repo_full}. GitHub does not create the .wiki.git repo until the first page is saved through the web UI. Open https://github.com/${repo_full}/wiki, create any page once, then re-run this workflow. The pipeline is not blocked — pages deployment succeeded independently."
            exit 0
          fi

          # Generate wiki content (Home, TOCTREE, engineering docs, _Sidebar)
          ./scripts/sync-wiki.sh "$wiki_dir"

          # Commit + push. force-with-lease makes re-runs idempotent if the
          # wiki history diverged (docbase is authoritative).
          short_sha="$(git rev-parse --short HEAD)"
          git -C "$wiki_dir" add -A
          if git -C "$wiki_dir" diff --cached --quiet; then
            echo "No wiki changes since last sync — skipping push."
            exit 0
          fi
          git -C "$wiki_dir" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: sync wiki from docbase@${short_sha}"
          git -C "$wiki_dir" push --force-with-lease origin HEAD
          echo "Wiki synced."

  # =========================================================================
  # 7. SONAR BASELINE — Establish SonarCloud main-branch baseline.
  #    Runs after promote pushes to main. Checks out main and runs a
  #    SonarCloud analysis with GITHUB_REF overridden to refs/heads/main so
  #    SonarCloud attributes the analysis to the main branch. This is
  #    informational only — no quality-gate check, no fail-closed. It
  #    ensures the SonarCloud dashboard has a current main-branch baseline
  #    for PR decoration and new-code calculations.
  # =========================================================================
  sonar_baseline:
    name: SonarCloud Main Baseline
    needs: [promote]
    if: |
      !cancelled() &&
      needs.promote.result == 'success' &&
      github.ref == 'refs/heads/dev-001' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository (main)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Check Sonar configuration
        id: check_sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::notice::SONAR_TOKEN not set — skipping SonarCloud baseline analysis."
            echo "has_sonar=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_sonar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Cloud Scan (main branch baseline)
        if: steps.check_sonar.outputs.has_sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_REF: refs/heads/main
