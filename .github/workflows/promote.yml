name: Promote

# Promotion pipeline: a push to dev-001 flows dev-001 -> dev -> main, in that order.
# See AGENTS.md#change-workflow. Stages are never skipped or reordered.

on:
  push:
    branches: [dev-001]
  # Manual re-run, e.g. to retry a promotion that failed on a transient error.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One promotion at a time. Without this, two rapid pushes to dev-001 can race and
  # promote out of order.
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # dev-001 -> dev is automatic. dev is the integration branch, so a failed promotion
  # there is contained and cheap to fix.
  promote-dev:
    name: dev-001 -> dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev-001

      - name: Check promotion is a fast-forward
        # `git push` already refuses a non-fast-forward by default, but it reports it as
        # an opaque "rejected (non-fast-forward)". Checking ancestry first turns that
        # into an explicit error naming the branches, and lets us skip cleanly when
        # dev-001 is already contained in dev.
        run: |
          git fetch origin dev --quiet
          # Capture the pre-push base. `git push` advances refs/remotes/origin/dev, so
          # the Summarize step cannot use origin/dev as its base after the push.
          echo "PROMOTE_BASE=$(git rev-parse origin/dev)" >> "$GITHUB_ENV"
          if [ -z "$(git log --oneline origin/dev..dev-001)" ]; then
            echo "::notice::dev-001 contains nothing new over dev. Nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/dev dev-001; then
            echo "::error::dev and dev-001 have diverged. Refusing to promote."
            echo "::error::Merge dev into dev-001 on a local clone, then push dev-001."
            exit 1
          fi
          echo "Promoting $(git rev-list --count origin/dev..dev-001) commit(s) to dev."

      - name: Push dev-001 to dev
        # No --force. A plain push cannot clobber a diverged dev.
        run: git push origin "dev-001:dev"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### dev-001 -> dev"
            echo
            git log --oneline --no-merges "$PROMOTE_BASE..dev-001" 2>/dev/null \
              | head -20 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  # dev -> main is gated. `main` is the stable branch, so promoting to it requires
  # approving the `main` environment (Settings -> Environments -> main -> Required
  # reviewers). If that protection is not configured, this job still runs unattended and
  # main receives commits with no human in the loop - verify it before first use.
  promote-main:
    name: dev -> main
    needs: promote-dev
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Check promotion is a fast-forward
        run: |
          git fetch origin main --quiet
          echo "PROMOTE_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          if [ -z "$(git log --oneline origin/main..dev)" ]; then
            echo "::notice::dev contains nothing new over main. Nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main dev; then
            echo "::error::main and dev have diverged. Refusing to promote."
            exit 1
          fi
          echo "Promoting $(git rev-list --count origin/main..dev) commit(s) to main."

      - name: Push dev to main
        run: git push origin "dev:main"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### dev -> main"
            echo
            git log --oneline --no-merges "$PROMOTE_BASE..dev" 2>/dev/null \
              | head -20 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
