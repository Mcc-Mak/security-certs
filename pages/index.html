<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Certs — Study Notes</title>
  <meta name="description" content="CompTIA Network+ and ISC CISSP certification study notes with Mermaid diagrams.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1f4da;</text></svg>">

  <!-- Bootstrap (loaded before Docsify theme so Docsify overrides where they conflict) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">

  <!-- Docsify theme (overrides Bootstrap for Docsify chrome) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css"
        integrity="sha384-jCK82M2ExfkqAO/MYBKMjP1qC4AvZ4/Duf2gVWOy3RPn26uz+KW5I+9S39za1Fqv" crossorigin="anonymous">

  <!-- Sidebar collapse plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"
        integrity="sha384-ZGJuqxSp+PqtY/ZXzC7+T2D9FA6MZiNEZsgHgzbrC1kRdqywNoPCa9OBv8Fy5xdX" crossorigin="anonymous">

  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.esm.min.mjs"
        integrity="sha384-ngTqQFGZO/UNk+6W7oe9xpqFSOUHQUL8VAb6oHZdH492UegObDwoIkWN/nySekUR" crossorigin="anonymous">
  <style>
    .sidebar-nav h2 { font-size: 1.1rem; }
    .markdown-section { max-width: 900px; }

    /* Bootstrap + Docsify integration */
    /* Bootstrap Reboot sets body styles; Docsify theme overrides most, but reset a few */
    body { font-family: var(--docsify-font-family, "Source Sans Pro", "Helvetica Neue", Arial, sans-serif); }
    .markdown-section > :first-child { margin-top: 0; }
    /* Let Bootstrap .container work inside content without Docsify conflicts */
    .markdown-section .container { width: 100%; padding: 0; margin: 0; }
    /* Bootstrap tables inside content — keep Docsify striped style */
    .markdown-section table { width: 100%; }
    /* Cards: ensure they render well inside Docsify's .markdown-section */
    .markdown-section .card { margin-bottom: 1rem; }
    /* Card button alignment: flexbox pushes hr + buttons to bottom */
    .markdown-section .card .card-body { display: flex; flex-direction: column; }
    .markdown-section .card .card-text { flex: 1 1 auto; }
    .markdown-section .card .badge,
    .markdown-section .card .btn { align-self: flex-start; }
    /* Badge spacing */
    .markdown-section .badge { margin: 0 .2rem .2rem 0; }

    /* CRITICAL: Override Bootstrap .collapse:not(.show){display:none}
       The docsify-sidebar-collapse plugin adds .collapse to li elements
       to indicate collapsed state, but Bootstrap hides the entire li.
       We only want the ul children hidden (handled by plugin CSS), not
       the folder label itself. */
    .sidebar-nav li.collapse { display: list-item !important; }

    /* Sidebar folder headers: make them stand out */
    .sidebar-nav > ul > li.folder > a,
    .sidebar-nav > ul > li.folder > p > a {
      font-weight: 700;
      font-size: 15px;
      color: #2c3e50;
    }
    /* Level-2 folder headers (exam names nested under Overview) */
    .sidebar-nav > ul > li > ul > li.folder > a {
      font-weight: 700;
      font-size: 14px;
      color: #2c3e50;
    }
    /* Hide auto-generated heading sub-sidebars for folder entries
       (Overview, exams) while preserving them for file entries (sessions) */
    .sidebar-nav li.folder > .app-sub-sidebar { display: none !important; }
    /* Ensure folder cursor indicates clickability */
    .sidebar-nav li.folder { cursor: pointer; }

    /* Improve sidebar link contrast */
    .sidebar ul li a { color: #364149; }
    .sidebar ul li a:hover { color: #42b983; }

    /* Blockquote: improve contrast (Docsify default is faded gray) */
    .markdown-section blockquote { color: #555; border-left-color: #42b983; }

    /* Ensure table text has good contrast */
    .markdown-section th { color: #2c3e50; }
    .markdown-section td { color: #34495e; }

    /* Buttons inside content: exclude from Docsify link styling */
    .markdown-section a.btn { font-weight: 400; text-decoration: none; }

    /* Sidebar nav padding */
    .sidebar-nav > ul { padding-left: 1rem; padding-right: 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function replaceSearchTitles() {
      document.querySelectorAll('.results-panel .matching-post h2').forEach(function(h2) {
        if (h2.dataset.filenameReplaced) return;
        var a = h2.closest('a');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        var path = href.replace(/^#/, '').split('?')[0];
        var filename = path.split('/').pop();
        if (filename) {
          h2.textContent = filename;
          h2.dataset.filenameReplaced = 'true';
        }
      });
    }

    window.$docsify = {
      name: 'Security Certs',
      repo: 'Mcc-Mak/security-certs',
      relativePath: true,
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      search: {
        placeholder: 'Search notes...',
        noData: 'No results',
        depth: 3,
        paths: 'all',
        hideOtherSidebarContent: true
      },
      mermaidConfig: {
        querySelector: '.mermaid'
      },
      plugins: [
        function mermaidPlugin(hook) {
          var mermaidLoaded = false;
          hook.beforeEach(function(content) {
            if (!mermaidLoaded && content.includes('```mermaid')) {
              mermaidLoaded = true;
            }
            return content;
          });
          hook.afterEach(function(html) {
            return html;
          });
        },
        function searchFilenamePlugin(hook) {
          hook.mounted(function() {
            var panel = document.querySelector('.results-panel');
            if (!panel) return;
            var observer = new MutationObserver(replaceSearchTitles);
            observer.observe(panel, { childList: true });
            replaceSearchTitles();
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1"
          integrity="sha384-KaHhgnx/OTLoJ4J33SSJsF4x1pk4I7q3s5ZOfIDHJYl6IG7Oyn2vNDsHiWJe46fD" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"
          integrity="sha384-LthJPBJ4RGco78kBY+EmKz5rmISZ5vrtAu3+l2ALQ2mrZHOe6Wyf6knyKjeC4cL6" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"
          integrity="sha384-lMHOyuqf3B/T/BgfYxUKprN0bdRf8KhVTE11w76Tvtze86XHVSDYzxqNGDGgIi9I" crossorigin="anonymous"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false });

    const renderMermaid = () => {
      document.querySelectorAll('pre[data-lang="mermaid"]').forEach((el, i) => {
        const code = el.querySelector('code');
        if (!code) return;
        const graph = code.textContent;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = graph;
        div.id = 'mermaid-' + i;
        el.replaceWith(div);
      });
      if (document.querySelector('.mermaid')) {
        mermaid.run();
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver(() => renderMermaid());
      observer.observe(document.getElementById('main'), { childList: true, subtree: true });
    });
  </script>
</body>
</html>
